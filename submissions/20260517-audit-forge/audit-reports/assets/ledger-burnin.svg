  <text x="248" y="766" fill="#63d0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">01 READ</text>
  <text x="248" y="820" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Read the burn-in report first.</text>
  <text x="248" y="878" fill="#97a4c0" font-family="Inter, Arial, sans-serif" font-size="26">This is the grounding step before any fix.</text>
  <rect x="208" y="1008" width="680" height="170" rx="34" fill="#141d31" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <text x="248" y="1088" fill="#ffbf5f" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">02 LOCATE</text>
  <text x="248" y="1138" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Find the smallest file set.</text>
  <rect x="208" y="1210" width="680" height="170" rx="34" fill="#141d31" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <text x="248" y="1290" fill="#ffbf5f" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">03 HYPOTHESIZE</text>
  <text x="248" y="1340" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Write one repair idea.</text>
