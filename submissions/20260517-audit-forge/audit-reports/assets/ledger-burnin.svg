  <text x="208" y="250" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">Ledger</text>
  <text x="208" y="308" fill="#97a4c0" font-family="Inter, Arial, sans-serif" font-size="30">Ratchet progress should be explicit</text>
