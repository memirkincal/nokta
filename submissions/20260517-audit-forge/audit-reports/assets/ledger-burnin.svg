  <text x="246" y="472" fill="#ffbf5f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Forge loop</text>
  <text x="246" y="530" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">The ledger keeps the human touch points auditable.</text>
