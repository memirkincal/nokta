<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#e8edf7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="2200" fill="url(#bg)"/>
  <rect x="180" y="110" rx="56" ry="56" width="840" height="1980" fill="#111" opacity="0.15"/>
  <rect x="160" y="90" rx="54" ry="54" width="840" height="1980" fill="#0b1020"/>
  <rect x="160" y="90" rx="54" ry="54" width="840" height="1980" fill="url(#screen)"/>
  <rect x="208" y="160" width="260" height="22" rx="11" fill="#ffbf5f" opacity="0.85"/>
  <text x="208" y="250" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">Nokta Forge</text>
  <text x="208" y="312" fill="#97a4c0" font-family="Inter, Arial, sans-serif" font-size="30">Drop-in audit, no backend</text>
  <rect x="208" y="410" width="680" height="248" rx="36" fill="#141d31" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <text x="248" y="494" fill="#ffbf5f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Single mount</text>
  <text x="248" y="548" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">AuditWidget lives in the host tree</text>
  <text x="248" y="608" fill="#97a4c0" font-family="Inter, Arial, sans-serif" font-size="28">The widget stays host-boundary friendly and can be removed.</text>
  <rect x="208" y="720" width="300" height="170" rx="30" fill="#1c2740" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <text x="240" y="792" fill="#63d0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Capture</text>
  <text x="240" y="842" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="26">Tap the FAB and keep the context.</text>
  <rect x="544" y="720" width="300" height="170" rx="30" fill="#1c2740" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <text x="576" y="792" fill="#63d0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Burn in</text>
  <text x="576" y="842" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="26">Yellow highlight becomes part of the image.</text>
  <rect x="208" y="940" width="636" height="330" rx="40" fill="#ffbf5f" opacity="0.10" stroke="#ffbf5f" stroke-width="8"/>
  <text x="248" y="1030" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">A host app should survive without the widget.</text>
  <text x="248" y="1100" fill="#97a4c0" font-family="Inter, Arial, sans-serif" font-size="28">The yellow box marks the CTA lane that needs protection.</text>
  <circle cx="890" cy="1850" r="74" fill="#ff6f91"/>
  <text x="862" y="1860" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">FAB</text>
</svg>
